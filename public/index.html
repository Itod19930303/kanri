<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanri — チケット管理</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen" style="background:#f5f3ff">

  <!-- Header -->
  <header class="navbar shadow-sm sticky top-0 z-20 px-0" style="background:#fff; border-bottom:1px solid #e5e0f8">
    <div class="max-w-screen-2xl mx-auto w-full flex items-center px-4 gap-2">

      <div class="flex-1 flex items-center gap-2 min-w-0">
        <!-- Back button (hidden on project list) -->
        <button id="btn-back" class="btn btn-ghost btn-sm hidden flex-shrink-0" title="プロジェクト一覧へ戻る">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span class="hidden sm:inline text-xs">一覧</span>
        </button>

        <!-- Logo -->
        <div class="flex items-center gap-2 flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" style="color:#5624d0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          <span class="text-lg font-bold tracking-tight" style="color:#1c1d1f">Kanri</span>
        </div>

        <!-- Project name (hidden on project list) -->
        <span id="header-project-name" class="hidden text-sm font-bold truncate" style="color:#5624d0; border-left:2px solid #c4b5fd; padding-left:0.6rem; max-width:180px"></span>

        <!-- Ticket count (hidden on project list) -->
        <span id="ticket-count" class="hidden text-xs font-bold flex-shrink-0" style="color:#374151"></span>
      </div>

      <div class="flex-none flex items-center gap-2">
        <!-- User info (shown after login) -->
        <div id="user-info" class="hidden items-center gap-1.5">
          <div id="user-avatar"
            class="w-7 h-7 rounded-full overflow-hidden flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
            style="background:#5624d0" title="ユーザー"></div>
          <button id="btn-logout" class="btn btn-ghost btn-xs" title="ログアウト">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
          </button>
        </div>

        <!-- Project list controls -->
        <div id="project-controls" class="flex items-center gap-2">
          <button id="btn-new-project" class="btn btn-sm gap-1 text-white" style="background:#5624d0; border-color:#5624d0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span class="hidden sm:inline">新規プロジェクト</span>
          </button>
        </div>

        <!-- Ticket controls (hidden on project list) -->
        <div id="ticket-controls" class="hidden flex items-center gap-2">
          <!-- Search (desktop) -->
          <label class="input input-bordered input-sm flex items-center gap-2 hidden md:flex" style="border-color:#d1d7dc">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="search-input" placeholder="検索…" class="w-40 bg-transparent outline-none text-sm">
          </label>

          <!-- Priority filter -->
          <select id="filter-priority" class="select select-bordered select-sm hidden sm:block" style="border-color:#d1d7dc">
            <option value="">優先度: すべて</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>

          <!-- Label filter -->
          <select id="filter-label" class="select select-bordered select-sm hidden sm:block" style="border-color:#d1d7dc">
            <option value="">ラベル: すべて</option>
          </select>

          <!-- Mobile filter toggle -->
          <button id="btn-filter-toggle" class="btn btn-ghost btn-sm sm:hidden" title="フィルター">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/>
            </svg>
          </button>

          <!-- View toggle -->
          <div class="join">
            <button id="btn-dashboard" class="btn btn-sm join-item view-btn" title="ダッシュボード">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10 0a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
              </svg>
            </button>
            <button id="btn-kanban" class="btn btn-sm join-item view-btn view-btn-active" title="カンバン">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/>
              </svg>
            </button>
            <button id="btn-list" class="btn btn-sm join-item view-btn" title="リスト">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
              </svg>
            </button>
            <button id="btn-gantt" class="btn btn-sm join-item view-btn" title="ガントチャート">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </button>
          </div>

          <!-- New ticket -->
          <button id="btn-new" class="btn btn-sm gap-1 text-white" style="background:#5624d0; border-color:#5624d0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            <span class="hidden sm:inline">新規</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile ticket UI (search + filter panel, hidden on project list) -->
  <div id="mobile-ticket-ui" class="hidden">
    <div class="px-4 pt-3 md:hidden max-w-screen-2xl mx-auto w-full">
      <label class="input input-bordered input-sm flex items-center gap-2 w-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" placeholder="検索…" class="bg-transparent outline-none text-sm w-full"
          oninput="document.getElementById('search-input').value=this.value;document.getElementById('search-input').dispatchEvent(new Event('input'))">
      </label>
    </div>

    <div id="mobile-filter-panel" class="hidden sm:hidden px-4 pt-2 pb-1 max-w-screen-2xl mx-auto w-full">
      <div class="flex gap-2">
        <select id="mob-filter-priority" class="select select-bordered select-sm flex-1" style="border-color:#d1d7dc">
          <option value="">優先度: すべて</option>
          <option value="high">高</option>
          <option value="medium">中</option>
          <option value="low">低</option>
        </select>
        <select id="mob-filter-label" class="select select-bordered select-sm flex-1" style="border-color:#d1d7dc">
          <option value="">ラベル: すべて</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="p-4 max-w-screen-2xl mx-auto w-full">
    <!-- Project list view -->
    <div id="project-view"></div>

    <!-- Ticket views (hidden until entering a project) -->
    <div id="dashboard-view" class="hidden"></div>
    <div id="kanban-view" class="hidden flex gap-4 items-start"></div>
    <div id="list-view" class="hidden"></div>
    <div id="gantt-view" class="hidden"></div>
  </main>

  <!-- Ticket modal -->
  <dialog id="ticket-modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box" style="background:#fff">
      <h3 class="font-bold text-lg mb-4" id="modal-title-text" style="color:#1c1d1f">新しいチケット</h3>

      <form id="ticket-form" method="dialog" class="flex flex-col gap-3">
        <label class="form-control">
          <div class="label"><span class="label-text font-medium">タイトル <span class="text-error">*</span></span></div>
          <input name="title" type="text" placeholder="チケットのタイトル" class="input input-bordered" required>
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text font-medium">説明</span></div>
          <textarea name="description" placeholder="詳細説明…" class="textarea textarea-bordered h-24 resize-none"></textarea>
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="form-control">
            <div class="label"><span class="label-text font-medium">ステータス</span></div>
            <select name="status" class="select select-bordered">
              <option value="todo">Todo</option>
              <option value="not_started">未着手</option>
              <option value="in_progress">進行中</option>
              <option value="done">完了</option>
            </select>
          </label>
          <label class="form-control">
            <div class="label"><span class="label-text font-medium">優先度</span></div>
            <select name="priority" class="select select-bordered">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </label>
        </div>

        <label class="form-control">
          <div class="label"><span class="label-text font-medium">期限日</span></div>
          <input name="dueDate" type="date" class="input input-bordered">
        </label>

        <!-- Labels chip input -->
        <div class="form-control">
          <div class="label"><span class="label-text font-medium">ラベル</span></div>
          <div id="label-chips-container" class="label-chips-container">
            <div id="label-chips"></div>
            <input id="label-input" type="text" list="label-suggestions"
              placeholder="入力してEnterで追加…" class="label-chip-input">
          </div>
          <datalist id="label-suggestions"></datalist>
        </div>

        <!-- Parent ticket -->
        <label class="form-control">
          <div class="label"><span class="label-text font-medium">親課題</span></div>
          <select id="parent-select" class="select select-bordered">
            <option value="">なし（ルート課題）</option>
          </select>
        </label>

        <div class="flex justify-between items-center mt-2">
          <button type="button" id="modal-delete" class="btn btn-error btn-sm hidden">削除</button>
          <div class="flex gap-2 ml-auto">
            <button type="button" id="modal-cancel" class="btn btn-sm" style="background:#f3f0ff;border-color:#c4b5fd;color:#5624d0">キャンセル</button>
            <button type="submit" class="btn btn-sm text-white" style="background:#5624d0; border-color:#5624d0">保存</button>
          </div>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- プロジェクトモーダル -->
  <dialog id="project-modal" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box" style="background:#fff; max-width:480px">
      <h3 class="font-bold text-lg mb-4" id="project-modal-title-text" style="color:#1c1d1f">新しいプロジェクト</h3>

      <form id="project-form" class="flex flex-col gap-3">
        <label class="form-control">
          <div class="label"><span class="label-text font-medium">プロジェクト名 <span class="text-error">*</span></span></div>
          <input id="project-name-input" type="text" placeholder="プロジェクト名を入力" class="input input-bordered" required>
        </label>

        <label class="form-control">
          <div class="label"><span class="label-text font-medium">説明</span></div>
          <textarea id="project-desc-input" placeholder="プロジェクトの説明（任意）" class="textarea textarea-bordered h-20 resize-none"></textarea>
        </label>

        <div class="form-control">
          <div class="label"><span class="label-text font-medium">カラー</span></div>
          <div id="project-color-swatches" class="flex gap-2 flex-wrap"></div>
        </div>

        <div class="flex justify-between items-center mt-2">
          <button type="button" id="project-modal-delete" class="btn btn-error btn-sm hidden">削除</button>
          <div class="flex gap-2 ml-auto">
            <button type="button" id="project-modal-cancel" class="btn btn-sm" style="background:#f3f0ff;border-color:#c4b5fd;color:#5624d0">キャンセル</button>
            <button type="submit" class="btn btn-sm text-white" style="background:#5624d0; border-color:#5624d0">保存</button>
          </div>
        </div>
      </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- 削除確認モーダル -->
  <dialog id="delete-modal" class="modal modal-middle">
    <div class="modal-box" style="background:#fff; max-width:400px">
      <div class="flex items-center gap-3 mb-3">
        <div class="rounded-full p-2" style="background:#fef2f2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" style="color:#ef4444" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </div>
        <h3 class="font-bold text-lg" style="color:#1c1d1f">削除の確認</h3>
      </div>
      <p id="delete-modal-msg" class="text-sm" style="color:#374151"></p>
      <p id="delete-modal-sub" class="text-xs mt-1" style="color:#6a6f73; display:none"></p>
      <div class="flex justify-end gap-2 mt-5">
        <button id="delete-modal-cancel" class="btn btn-sm" style="background:#f3f0ff;border-color:#c4b5fd;color:#5624d0">キャンセル</button>
        <button id="delete-modal-confirm" class="btn btn-sm btn-error">削除する</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- ログイン画面 -->
  <div id="login-screen" class="login-screen-overlay">
    <div class="login-card">
      <!-- Logo -->
      <div class="flex items-center justify-center gap-2 mb-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" style="color:#5624d0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
        <span class="text-2xl font-bold" style="color:#1c1d1f">Kanri</span>
      </div>
      <p class="text-center text-sm mb-6" style="color:#6a6f73">チケット管理ツール</p>

      <!-- ローディング（認証状態確認中） -->
      <div id="login-loading" class="text-center py-6">
        <span class="loading loading-spinner loading-md" style="color:#5624d0"></span>
        <p class="text-sm mt-3" style="color:#6a6f73">確認中…</p>
      </div>

      <!-- ログインフォーム -->
      <div id="login-form-container" class="hidden">
        <!-- Google -->
        <button id="btn-google-signin" class="login-google-btn">
          <svg class="h-5 w-5 flex-shrink-0" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span>Google でサインイン</span>
        </button>

        <!-- セパレータ -->
        <div class="login-divider"><span>または</span></div>

        <!-- メール/パスワード -->
        <form id="login-form" class="flex flex-col gap-3">
          <input id="login-email" type="email" placeholder="メールアドレス"
            class="input input-bordered w-full" autocomplete="email" required>
          <input id="login-password" type="password" placeholder="パスワード（6文字以上）"
            class="input input-bordered w-full" autocomplete="current-password" required>
          <button type="submit" id="login-submit-btn" class="btn w-full text-white"
            style="background:#5624d0; border-color:#5624d0">ログイン</button>
        </form>

        <!-- エラー -->
        <p id="login-error" class="hidden text-sm text-center mt-3" style="color:#ef4444"></p>

        <!-- 新規登録トグル -->
        <p class="text-center mt-4 text-sm" style="color:#6a6f73">
          <span id="login-toggle-label">アカウントをお持ちでない方は</span>
          <button type="button" id="login-toggle-btn"
            class="font-bold ml-1" style="color:#5624d0; background:none; border:none; cursor:pointer">新規登録</button>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/list.js"></script>
  <script src="js/gantt.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
